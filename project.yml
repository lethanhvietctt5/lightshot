# XcodeGen spec for the Lightshot menu-bar app.
#
# The generated Lightshot.xcodeproj is NOT committed (it is a build artifact derived from
# this file). Run `xcodegen generate` after cloning or after editing this spec, then use
# the xcodebuild commands in AGENTS.md. The domain core lives in the LightshotKit SwiftPM
# package and is consumed here as a local package dependency — the app depends on the
# package, never the reverse.
name: Lightshot

options:
  bundleIdPrefix: dev.lightshot
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  LightshotKit:
    path: LightshotKit

targets:
  Lightshot:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    # Signing lives in the xcconfig (unsigned by default, overridable per machine via a
    # gitignored Local.xcconfig) — do not set CODE_SIGN* keys below, they would win.
    configFiles:
      Debug: App/Config/Signing.xcconfig
      Release: App/Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Lightshot
        PRODUCT_BUNDLE_IDENTIFIER: dev.lightshot.app
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: LightshotKit
        product: LightshotKit
